<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name ="viewport"content="width=device-width,initial-scale=1.0">

        <title>the stardust paradox</title>

    <link
    href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&display=swap"
    rel="stylesheet"
    >

    <link rel= "stylesheet" href="style.css">
    <script src="script.js" defer> </script>
    </head>

    <body>
        <div class="backgrounds" aria-hidden="true">
            <img class="background active" src= "assets/bg-1.jpg" alt="pictureofgalaxy">
             <img class="background active" src= "assets/bg-2side.jpg" alt="pictureofgalaxy">
              <img class="background active" src= "assets/bg-3.jpg" alt="pictureofgalaxy">
        </div>

        <div class="shade" aria-hidden="true"></div>
        <div id="stars" aria-hidden="true"></div>
        
        <main id="landing">
            <h1 class="title">
                <span>the</span>
                <span>stardust</span>
                <span>paradox</span>
            </h1>

            <nav class="menu" aria-label="main menu">
                <button id="about-button"type="button">about</button>
                <button id="begin-button"type="button">begin</button>
            </nav>
        </main>

         <dialog id="about-dialog">
    <h2>About</h2>
    <p>
      This is an interactive webpage on the internet that serves the purpose of
    </p>

    <form method="dialog">
      <button type="submit">Close</button>
    </form>
  </dialog>

  <section id="story-screen" hidden>
    <div id="story-content">
        <p id="story-text"></p>
        <p id="story-credit"></p>

        <button id="story-next" type="button">continue</button>
        </div>
    
  </section>

  <section id="room" hidden aria-label="observatory">
    <img 
    class="room-image"
    src="assets/observatory.jpg"
    alt="old observatory picture">

    <button id="telescope-button"type="button">
        look out the night sky
        </button>
    </section>

   <section id="telescope-screen" hidden aria-label="Telescope view">
  <div id="sky-view">
    <img
      id="sky-picture"
      src="assets/night-skywoa.png"
      alt="A view of the night sky."
    >
  </div>

  <button id="telescope-back" type="button">
    back to room
  </button>

  <button id="analyse-button" type="button">
    analyse the target star
  </button>

  <div id="spectrum-panel">
    <h2>the recorded spectrum from the target star: </h2>

    <div
      class="spectrum-strip"
      role="img"
      aria-label="light emmisions from a star"
    >
      <span style="--x: 12%; --colour: #a78bfa;"></span>
      <span style="--x: 26%; --colour: #657aff;"></span>
      <span style="--x: 40%; --colour: #58d5ee;"></span>
      <span style="--x: 55%; --colour: #83e8a0;"></span>
      <span style="--x: 71%; --colour: #f5d675;"></span>
      <span style="--x: 87%; --colour: #f07676;"></span>
    </div>

    <p id="spectrum-caption">
      match these bright lines to the chart to see which chemical elements are in the star.
    </p>
  </div>
</section>

</body>
</html>
